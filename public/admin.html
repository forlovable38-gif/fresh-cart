<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreshCart Admin</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="/">🥬 Fresh<span>Cart</span> Admin</a><a href="/">← Store</a></header><main class="admin"><small>PRIVATE STORE PANEL</small><h1>Admin dashboard</h1><p>Enter the password configured in Render environment variables.</p><form id="login" class="login"><input id="password" type="password" required placeholder="Admin password"><button>Connect admin</button></form><p id="message" role="status"></p><div id="workspace" hidden><nav class="admin-tabs"><button type="button" data-tab="orders">Orders</button><button type="button" data-tab="products">Products</button><button type="button" data-tab="offers">Offers</button></nav><section id="orders-tab"><h2>Orders</h2><div id="orders"></div></section><section id="products-tab" hidden><h2>Product management</h2><form id="product-form" class="admin-form"><h3 id="product-form-title">Add product</h3><input type="hidden" name="editingId"><label>Product ID (lowercase, no spaces)<input name="id" required pattern="[a-z0-9-]{2,40}" placeholder="e.g. basmati-rice"></label><label>Name<input name="name" required maxlength="120"></label><label>Unit / pack size<input name="unit" maxlength="80" placeholder="1 kg pack"></label><label>Price in ₹<input name="price" type="number" required min="0" step="0.01"></label><label>Stock quantity<input name="stock" type="number" required min="0" step="1"></label><label>Category<input name="category" maxlength="80"></label><label>Emoji icon<input name="emoji" maxlength="12" placeholder="🛒"></label><label>Image HTTPS URL<input name="imageUrl" type="url" placeholder="https://... (optional)"></label><label>Description<textarea name="description" maxlength="1000"></textarea></label><div class="admin-actions"><button>Save product</button><button type="button" id="reset-product" class="secondary">Clear</button></div></form><h3>Products</h3><div id="products"></div></section><section id="offers-tab" hidden><h2>Offers management</h2><form id="offer-form" class="admin-form"><h3>Create offer</h3><label>Offer title<input name="title" required maxlength="120"></label><label>Description<input name="description" maxlength="500"></label><label>Product ID (blank = storewide offer)<input name="productId" maxlength="40"></label><label>Discount type<select name="discountType"><option value="percent">Percentage</option><option value="fixed">Fixed ₹ amount</option></select></label><label>Discount value<input name="discountValue" type="number" required min="0.01" step="0.01"></label><label>Start date (optional)<input name="startsAt" type="datetime-local"></label><label>End date (optional)<input name="endsAt" type="datetime-local"></label><label class="inline-check"><input name="isActive" type="checkbox" checked> Active immediately / when scheduled</label><button>Create offer</button></form><h3>Existing offers</h3><div id="offers-admin"></div></section></div></main><script src="admin.js"></script></body></html>
